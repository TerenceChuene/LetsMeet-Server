services:
  postgres:
    image: postgres:16-alpine
    container_name: letsmeet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: letsmeet
      POSTGRES_PASSWORD: letsmeet
      POSTGRES_DB: letsmeet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letsmeet -d letsmeet"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: letsmeet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.8.4
    container_name: letsmeet-livekit
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml", "--dev"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50050:50000-50050/udp"
    volumes:
      - ./docker/livekit.yaml:/etc/livekit.yaml:ro
    # Dev mode also accepts API key/secret: devkey / secret

  # Azure Blob emulator (app download/upload/health). LiveKit egress needs a real Azure account.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    container_name: letsmeet-azurite
    restart: unless-stopped
    command:
      [
        "azurite",
        "--blobHost",
        "0.0.0.0",
        "--queueHost",
        "0.0.0.0",
        "--tableHost",
        "0.0.0.0",
        "--location",
        "/data",
        "--skipApiVersionCheck",
      ]
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(10000,'127.0.0.1',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  azurite_data:
