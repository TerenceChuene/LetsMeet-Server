# Local LiveKit config for Docker Compose (dev keys — never use in production)
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50050
  use_external_ip: false

keys:
  devkey: secret

logging:
  level: info

# Point this at your API when testing webhooks from Docker:
# webhook:
#   urls:
#     - http://host.docker.internal:3000/api/v1/webhooks/livekit
#   api_key: devkey
